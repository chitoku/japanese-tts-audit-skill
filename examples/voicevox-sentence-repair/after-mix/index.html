<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文単位の結合音声</title><main style="max-width:900px;margin:auto;font-family:sans-serif;line-height:1.8"><h1>文単位の結合音声</h1><p>採用版（根拠は各文の記録を参照）。各文の音声サンプルを変更せず結合しています。音量や話し方の統一を保証するものではありません。継ぎ目を聴いて確認してください。</p><audio controls src="narration.wav" style="width:100%"></audio><h2>継ぎ目の確認</h2><p>S001 → S002</p><audio controls preload="none" src="join-S001-S002.wav"></audio><p>S002 → S003</p><audio controls preload="none" src="join-S002-S003.wav"></audio></main><script>const aa=[...document.querySelectorAll('audio')];let current=aa[0];aa.forEach(a=>{a.onplay=()=>{current=a;aa.forEach(b=>{if(a!==b)b.pause()})};a.onpointerdown=()=>current=a});document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,[contenteditable=true]'))return;e.preventDefault();if(current){if(current.paused)current.play().catch(()=>{});else current.pause()}});</script></html>
